
name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Package production files
        shell: bash
        run: |
          set -euo pipefail

          tar -czf deploy.tar.gz -C dist .

          echo "Archive size:"
          ls -lh deploy.tar.gz

          echo "Files included in archive:"
          tar -tzf deploy.tar.gz | wc -l

      - name: Upload production archive
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )

          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"

          echo "Preparing remote upload..."
          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "rm -f /tmp/yitaofu-deploy.tar.gz && \
             rm -rf /tmp/yitaofu-deploy && \
             mkdir -p /tmp/yitaofu-deploy"

          echo "Uploading one archive..."
          scp "${SSH_OPTS[@]}" \
            deploy.tar.gz \
            "$REMOTE:/tmp/yitaofu-deploy.tar.gz"

          echo "Verifying uploaded archive..."
          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "test -s /tmp/yitaofu-deploy.tar.gz && \
             tar -tzf /tmp/yitaofu-deploy.tar.gz > /dev/null"

          echo "Archive upload and integrity check passed."

      - name: Activate deployment
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )

          ssh "${SSH_OPTS[@]}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          DEPLOY_PATH="${{ secrets.SERVER_PATH }}"
          STAGING="${DEPLOY_PATH}.new"
          BACKUP="${DEPLOY_PATH}.old"
          ARCHIVE="/tmp/yitaofu-deploy.tar.gz"

          echo "Preparing staging directory..."
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          echo "Extracting archive..."
          tar -xzf "$ARCHIVE" -C "$STAGING"

          echo "Validating deployment..."
          test -s "$STAGING/index.html"

          FILE_COUNT=$(find "$STAGING" -type f | wc -l)
          echo "Extracted files: $FILE_COUNT"

          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "ERROR: Deployment contains no files."
            exit 1
          fi

          echo "Switching production directory..."
          rm -rf "$BACKUP"

          if [ -d "$DEPLOY_PATH" ]; then
            mv "$DEPLOY_PATH" "$BACKUP"
          fi

          if mv "$STAGING" "$DEPLOY_PATH"; then
            echo "Deployment activated successfully."
            rm -rf "$BACKUP" "$ARCHIVE" /tmp/yitaofu-deploy
          else
            echo "ERROR: Activation failed. Attempting rollback..."

            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" "$DEPLOY_PATH"
            fi

            exit 1
          fi
          REMOTE_SCRIPT
